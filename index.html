<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRW NIHONGO - Login Siswa</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#ff9a9e,#fecfef);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:white;padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,0.2);width:90%;max-width:350px;text-align:center}
h1{color:#e91e63;margin:0 0 5px}
p{color:#666;font-size:14px}
input{width:100%;padding:12px;margin:15px 0;border:2px solid #ffcdd2;border-radius:10px;font-size:16px;text-transform:uppercase;box-sizing:border-box}
button{width:100%;padding:12px;background:#e91e63;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
button:hover{background:#c2185b}
.error{color:red;font-size:13px;margin-top:10px;display:none}
small{color:#999;font-size:11px;display:block;margin-top:15px}
</style>
</head>
<body>
<div class="card">
<h1>🌸 CRW NIHONGO</h1>
<p>Belajar Bahasa Jepang Seru!</p>
<input type="text" id="kode" placeholder="MASUKKAN KODE AKSES">
<button onclick="login()">MASUK KELAS →</button>
<div id="err" class="error">Kode salah! Hubungi admin.</div>
<small>Kode contoh: CRW001<br>Hubungi kakak untuk dapat kode</small>
</div>
<script>
const kodeValid = ["CRW001","CRW002","CRW003","CRW-JAGO","MIHONGO","ADMIN"];
function login(){
  let k = document.getElementById("kode").value.trim().toUpperCase();
  if(kodeValid.includes(k)){
    localStorage.setItem("crw_login",k);
    window.location.href="materi.html";
  }else{
    document.getElementById("err").style.display="block";
  }
}
</script>
</body>
</html>
